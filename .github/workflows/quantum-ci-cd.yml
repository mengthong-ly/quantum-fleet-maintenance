name: Quantum Fleet CI/CD

on:
  push:
    branches: [ "develop" ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout source
        uses: actions/checkout@v3

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build Docker image (tagged with commit SHA)
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/quantum-fleet:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/quantum-fleet:latest \
            .

      # 4️⃣ Push Docker images
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/quantum-fleet:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/quantum-fleet:latest

      # 5️⃣ Deploy to AWS EC2
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/quantum-fleet || exit 1

            echo "🛑 Stopping streamlit service..."
            docker compose stop streamlit || true

            echo "⬇️ Pulling latest image..."
            docker compose pull streamlit

            echo "🚀 Starting streamlit service..."
            docker compose up -d streamlit

            echo "🧹 Light cleanup (safe for EC2 free-tier)..."
            docker image prune -f
